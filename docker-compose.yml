version: '3.8'

services:
  autoshorts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoshorts-pipeline
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./storage:/app/storage
      - ./secrets:/app/secrets
    command: ["python", "main.py", "run"]
